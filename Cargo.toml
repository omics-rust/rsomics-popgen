[package]
name = "rsomics-popgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Connected neutral variation and population differentiation analysis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-popgen"
readme = "README.md"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE-2.0",
    "THIRD_PARTY.md",
    "docs/neutral-analysis.md",
    "src/**",
    "tests/**",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
rayon = "1"
rsomics-common = "=0.12.3"
rsomics-help = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
csv = "1"

[profile.release]
lto = "thin"
codegen-units = 1
